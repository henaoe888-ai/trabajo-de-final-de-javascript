{% extends 'usuarios/base.html' %}
{% block content %}
<div style="max-width: 400px; margin: 50px auto;" class="card">
    <h2 style="text-align: center; color: #d4af37;">💎 Iniciar Sesión</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Nombre de Usuario:</label>
            <input type="text" name="username" class="form-input" required>
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" name="password" class="form-input" required>
        </div>
        {% if form.errors %}
            <p style="color: red; font-family: Arial; font-size: 13px;">Usuario o contraseña incorrectos.</p>
        {% endif %}
        <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Ingresar</button>
    </form>
    <p style="text-align: center; margin-top: 20px; font-family: Arial; font-size: 13px;">
        ¿No tienes cuenta? <a href="{% url 'registro' %}" style="color: #d4af37; font-weight: bold;">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
